<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Container queries | TribuZen</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="contenu">
      <h1>La même carte, deux emplacements</h1>

      <div class="page">
        <div class="principal" id="principal">
          <article class="carte" id="carte-large">
            <div class="carte-corps">
              <img class="carte-media" src="../../logo.svg" alt="" />
              <div class="carte-texte">
                <h2>Atelier cuisine</h2>
                <p>Tous les dimanches matin, chez Alondra.</p>
              </div>
            </div>
          </article>
        </div>

        <aside class="lateral" id="lateral" aria-label="À côté">
          <article class="carte" id="carte-etroite">
            <div class="carte-corps">
              <img class="carte-media" src="../../logo.svg" alt="" />
              <div class="carte-texte">
                <h2>Atelier cuisine</h2>
                <p>Tous les dimanches matin, chez Alondra.</p>
              </div>
            </div>
          </article>
        </aside>
      </div>
    </main>
  </body>
</html>
