<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Cascade | TribuZen</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="contenu" id="app">
      <h1>Actions sur un membre</h1>

      <p><button type="button" class="bouton bouton-primaire">Inviter</button></p>

      <section class="carte">
        <h2>Alondra</h2>
        <div class="actions">
          <button type="button" class="bouton bouton-primaire">Inviter</button>
          <button type="button" class="bouton">Retirer</button>
        </div>
      </section>

      <p class="note cache">Cette note est masquée par un utilitaire.</p>
    </main>
  </body>
</html>
