<!doctype html>
<!-- SOLUTION DE REFERENCE. A n'ouvrir qu'apres ton GREEN. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Liste animée | Nahual</title>
    <link rel="stylesheet" href="../../commun.css" />
    <style>
      .liste { list-style: none; padding: 0; max-inline-size: 24rem; }
      .ligne { display: flex; justify-content: space-between; gap: 1rem; align-items: center;
               border: 1px solid #c8c8c8; border-radius: .4rem; padding: .6rem .8rem; margin-block: .35rem; background: Canvas; }
      .commandes { display: flex; gap: .5rem; margin-block-end: 1rem; }
      button { font: inherit; padding: .4rem .8rem; }
    </style>
  </head>
  <body>
    <main class="contenu">
      <h1>Participants</h1>

      <div class="commandes">
        <button type="button" id="trier">Trier par nombre d'ateliers</button>
      </div>

      <ul class="liste" id="liste"></ul>

      <!-- 7.5 (AA) : le changement est annonce SANS voler le focus. Module 10 § 5. -->
      <p role="status" id="annonce" class="visuellement-masque"></p>

      <!-- Point d'ancrage du focus : quand on retire l'element focuse, le focus va ici
           plutot que de partir sur le corps du document. -->
      <div id="ancrage" tabindex="-1"></div>
    </main>

    <script type="module" src="rendu.js"></script>
  </body>
</html>
